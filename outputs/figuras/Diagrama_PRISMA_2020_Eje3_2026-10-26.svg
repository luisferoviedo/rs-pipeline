    font-size: 15px;
    font-weight: 700;
    text-anchor: middle;
    fill: #111111;
  }
  .node rect {
    fill: #ffffff;
    stroke: #111111;
    stroke-width: 1.15;
    rx: 0;
    ry: 0;
  }
  .node.header.process-header rect {
