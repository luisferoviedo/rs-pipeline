<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="910" height="746" viewBox="0 0 910 746" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de flujo PRISMA 2020</title>
<desc id="desc">Diagrama de flujo de estilo PRISMA 2020 generado con prisma-flow.</desc>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6"
          refX="7.5" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" />
  </marker>
</defs>
<style>
  svg { background: #ffffff; color: #111827; }
  .diagram-title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-anchor: middle;
    fill: #111111;
  }
  .node rect {
    fill: #ffffff;
    stroke: #111111;
    stroke-width: 1.15;
    rx: 0;
    ry: 0;
  }
  .node.header.process-header rect {
    fill: #fbbf24;
    stroke: #b45309;
    stroke-width: 1.1;
    rx: 6;
    ry: 6;
  }
  .node.header.stage-label rect {
    fill: #9dc3e6;
    stroke: #1f4e79;
    stroke-width: 1.1;
    rx: 5;
    ry: 5;
  }
  .node.exclusion rect { fill: #ffffff; }
  .node text {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    fill: #111111;
  }
  .node.header.process-header text {
    font-size: 11px;
    font-weight: 700;
  }
  .node.header.stage-label text {
    font-size: 11px;
    font-weight: 700;
  }
  .node.note text {
    font-size: 10px;
  }
  .node.note.source text {
    font-size: 9.5px;
    font-style: italic;
  }
  .node.note.source-link text {
    fill: #1d4ed8;
    font-size: 10px;
    text-decoration: underline;
  }
  .edge {
    fill: none;
    stroke: #111111;
    stroke-width: 1.2;
    marker-end: url(#arrowhead);
  }
  marker polygon { fill: #111111; }
</style>
<g class="edges">
<path id="identified_to_removed" class="edge" d="M 380 120 L 440 120" marker-end="url(#arrowhead)" />
<path id="identified_to_screened" class="edge" d="M 240 170 L 240 210" marker-end="url(#arrowhead)" />
<path id="screened_to_reports_sought" class="edge" d="M 240 324 L 240 364" marker-end="url(#arrowhead)" />
<path id="screened_to_records_excluded" class="edge" d="M 380 267 L 440 267" marker-end="url(#arrowhead)" />
<path id="reports_sought_to_reports_assessed" class="edge" d="M 240 464 L 240 504" marker-end="url(#arrowhead)" />
<path id="reports_sought_to_not_retrieved" class="edge" d="M 380 414 L 440 414" marker-end="url(#arrowhead)" />
<path id="reports_assessed_to_included" class="edge" d="M 240 618 L 240 658" marker-end="url(#arrowhead)" />
<path id="reports_assessed_to_reports_excluded" class="edge" d="M 380 561 L 440 561" marker-end="url(#arrowhead)" />
</g>
<g class="nodes">
