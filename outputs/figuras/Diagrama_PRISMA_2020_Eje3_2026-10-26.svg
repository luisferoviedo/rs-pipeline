    <tspan x="454" dy="14">E1 Población (n = 28)</tspan>
    <tspan x="454" dy="14">E2 Intervención (n = 20)</tspan>
    <tspan x="454" dy="14">E3 Disciplina (n = 2)</tspan>
    <tspan x="454" dy="14">E4 Tipo de estudio (sin datos empíricos de resultados) (n = 42)</tspan>
    <tspan x="454" dy="14">E5 Tipo de publicación (n = 2)</tspan>
  </text>
</g>
<g id="included" class="node stage">
