  }
  .node.note.source text {
    font-size: 9.5px;
    font-style: italic;
  }
  .node.note.source-link text {
    fill: #1d4ed8;
    font-size: 10px;
    text-decoration: underline;
  }
  .edge {
    fill: none;
    stroke: #111111;
    stroke-width: 1.2;
    marker-end: url(#arrowhead);
  }
  marker polygon { fill: #111111; }
</style>
<text class="diagram-title" x="455" y="42">
