    <tspan x="454" dy="14">E2 Intervención (n = 347)</tspan>
    <tspan x="454" dy="14">E3 Disciplina (n = 92)</tspan>
    <tspan x="454" dy="14">E4 Tipo de estudio (sin datos empíricos de resultados) (n = 68)</tspan>
    <tspan x="454" dy="14">E5 Tipo de publicación (n = 37)</tspan>
