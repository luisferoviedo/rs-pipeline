<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="910" height="774" viewBox="0 0 910 774" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de flujo PRISMA 2020</title>
<desc id="desc">Diagrama de flujo de estilo PRISMA 2020 generado con prisma-flow.</desc>
<defs>
