# Libro de códigos v0 (D44). Texto de los criterios: criterios_v0.yaml
version: v0
decision: D44
fuente_criterios:
  archivo: config/criterios_v0.yaml
  sha256: 5df40f492afdbb69063dc1524125c9d92233a00cf898023c8c5dd4f039d5a21f
escala:
  0: No aparece, o la ficha dice explícitamente que no se reporta.
  1: 'Descrito: el laboratorio o la actividad lo tenía, pero el estudio no reporta su efecto.'
  2: 'Con resultado: el estudio lo vincula a un resultado (mejoró algo, o su ausencia causó problemas).'
reglas:
- Codificar solo lo que dice la ficha; no completar con conocimiento propio.
- Ante duda entre dos códigos, el menor.
- Un informe recibe un código por criterio (C01 a C09), siempre los nueve.
- El código 2 exige un vínculo con un resultado dicho en la ficha; que el estudio tenga resultados en
  general no basta.
- 'Los criterios C01 y C09 siguen en borrador: se codifican igual y se marcan en la nota si el enunciado
  no alcanza para decidir.'
