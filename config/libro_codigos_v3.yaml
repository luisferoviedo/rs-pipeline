# Libro de códigos v3. Texto de los criterios: criterios_v0.yaml
version: v3
decision: D50
fuente_criterios:
  archivo: config/criterios_v0.yaml
  sha256: 6ee5e11d426e98a32cc4960829c682db04dd32306fde65e0419942fb9cf96736
escala:
  0: No aparece, o la ficha dice explícitamente que no se reporta o que no se documenta.
  1: 'Aparece: la ficha menciona el componente como parte de la actividad o del laboratorio, con o sin
    resultado.'
reglas:
- Codificar solo lo que dice la ficha; no completar con conocimiento propio.
- Ante duda entre 0 y 1, el 0.
- Un informe recibe un código por criterio (C01 a C09), siempre los nueve.
- «1» exige que la ficha mencione el componente. Si no lo menciona, o dice que no se reporta o no se documenta,
  es 0, aunque se pueda suponer que existía.
- 'No se codifica atribución: da igual si el estudio vincula el componente con un resultado, si el resultado
  es del paquete completo o si el grupo de comparación también tuvo el componente.'
- Un dato descriptivo de contexto o de barrera (p. ej., el porcentaje de estudiantes sin internet en casa)
  cuenta como presencia (1).
- 'Los criterios C01, C06 y C09 siguen en borrador: se codifican igual y, si el enunciado no alcanza para
  decidir, se dice en la justificación de una línea.'
- C05, C06 y C08 se deciden con su lista «cuenta / no cuenta»; si un caso no está en ninguna lista, se
  aplica la regla de duda (0).
- La corrección o los comentarios del docente o de pares se codifican en C04, no en C06.
