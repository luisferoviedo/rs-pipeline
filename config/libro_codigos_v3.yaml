criterios:
- id: C01
  dimension: Acompañamiento y mediación pedagógica del aprendizaje
  criterio_corto: Mediación docente y participación activa del estudiante
  enunciado: El laboratorio virtual debe integrar sus funcionalidades tecnológicas con decisiones didácticas
    explícitas sobre su uso, de modo que el estudiante participe en un proceso guiado, autónomo y reflexivo,
    y no sea un usuario pasivo que solo ejecuta la simulación.
  estado: 'borrador: revisar Luis Fer'
  nota: Casi universal en la muestra de 40 (D49); en el marco será una condición base (D50).
- id: C02
  dimension: Estructuración didáctica y niveles de orientación de las actividades experimentales.
  criterio_corto: Estructuración y secuenciación guiada de las experiencias de aprendizaje experimental.
  enunciado: El laboratorio virtual debe ofrecer experiencias experimentales organizadas mediante guías
    didácticas estructuradas, con objetivos de aprendizaje, fundamentación conceptual, procedimientos,
    preguntas orientadoras y actividades de análisis que conduzcan progresivamente al estudiante desde
    la exploración hasta la interpretación y comunicación de resultados.
  estado: aprobado
  ejemplos:
    0: 'Ejemplo: «Se usó el simulador en una clase; no reporta guía ni estructura de las actividades.»'
    1: 'Ejemplo: «Cada práctica tenía una guía con objetivo, pasos numerados y preguntas finales; no se
      analiza su efecto.»'
  nota: Casi universal en la muestra de 40 (D49); en el marco será una condición base (D50).
- id: C03
  dimension: Interactividad y manipulación experimental en entornos de simulación.
  criterio_corto: Manipulación de variables y exploración experimental interactiva.
  enunciado: El laboratorio virtual debe permitir que el estudiante manipule variables independientes,
    modifique las condiciones de los sistemas simulados, utilice instrumentos virtuales y observe los
    cambios producidos en los fenómenos estudiados, facilitando la exploración de relaciones entre variables,
    la formulación de predicciones y la comprensión de procesos científicos.
  estado: aprobado
- id: C04
  dimension: Retroalimentación y evaluación formativa en entornos de experimentación virtual.
  criterio_corto: Retroalimentación formativa y seguimiento del aprendizaje experimental.
  enunciado: El laboratorio virtual debe favorecer procesos de retroalimentación continua mediante respuestas
    del sistema ante las acciones del estudiante, orientaciones del docente, espacios de discusión y mecanismos
    de autoevaluación que permitan reconocer avances, identificar errores y mejorar la comprensión de
    los fenómenos científicos.
  estado: aprobado
  ejemplos:
    0: 'Ejemplo: «Retroalimentación de la herramienta: no reporta.»'
    1: 'Ejemplo: «El docente comentaba las respuestas al cierre de la sesión; el estudio no evalúa ese
      comentario.»'
  nota: Incluye la corrección y los comentarios del docente o de pares (D50).
- id: C05
  dimension: Desarrollo de habilidades científicas mediante la experimentación virtual.
  criterio_corto: Desarrollo de habilidades de medición, análisis e interpretación experimental.
  enunciado: El laboratorio virtual debe proporcionar herramientas y escenarios que permitan al estudiante
    ejecutar procedimientos experimentales, utilizar instrumentos de medición, recolectar y procesar datos,
    representar resultados e interpretar fenómenos científicos para construir explicaciones sustentadas
    en evidencias.
  estado: aprobado
  ejemplos:
    0: 'Ejemplo: «Los estudiantes exploraban la simulación y explicaban lo que veían; no se menciona registro
      de datos.»'
    1: 'Ejemplo: «Los estudiantes registraban voltaje y corriente en una tabla y calculaban la resistencia.»'
  cuenta:
  - Mide con un instrumento, real o virtual.
  - Registra datos en una tabla o informe.
  - Calcula a partir de datos.
  - Grafica o interpreta datos propios.
  - Concluye a partir de datos.
  no_cuenta:
  - Solo manipula parámetros y observa.
  - Ve gráficas que genera el sistema, sin que el estudiante las procese.
  - Responde preguntas conceptuales.
  - «Realiza experimentos» sin mención de datos.
  - Explica o argumenta con lo observado, sin datos registrados.
- id: C06
  dimension: Mecanismos multimodales de retroalimentación y visualización del aprendizaje experimental.
  criterio_corto: Mecanismos multimodales de retroalimentación y visualización del aprendizaje experimental.
  enunciado: El laboratorio virtual debe proporcionar información oportuna sobre las acciones y resultados
    del estudiante mediante representaciones visuales, gráficas y respuestas automáticas, facilitando
    la identificación de errores, la comprensión de los resultados y el mejoramiento progresivo del desempeño
    experimental.
  estado: 'borrador: revisar Luis Fer'
  ejemplos:
    0: 'Ejemplo: «La simulación mostraba gráficas de energía mientras el estudiante cambiaba la altura.»'
    1: 'Ejemplo: «La simulación marcaba en rojo las conexiones erróneas del circuito y daba un puntaje.»'
  cuenta:
  - Un puntaje o una calificación automática del trabajo del estudiante.
  - Una marca o un mensaje de error del sistema.
  - Un indicador de estado o de riesgo que cambia según lo que hizo.
  - Un resultado del sistema que, según la ficha, deja ver el error del estudiante.
  no_cuenta:
  - Tener gráficos, animaciones o representaciones del fenómeno.
  - La respuesta visual al mover parámetros.
  - «Retroalimentación inmediata» sin decir qué muestra.
  - La corrección o los comentarios del docente o de pares (van a C04).
- id: C07
  dimension: Calidad técnica, usabilidad y condiciones de operación de los laboratorios virtuales.
  criterio_corto: Usabilidad, eficiencia y fiabilidad del entorno tecnológico.
  enunciado: El laboratorio virtual debe garantizar una interacción sencilla, eficiente y confiable, considerando
    la facilidad de uso, los tiempos de respuesta, los requisitos técnicos, la compatibilidad con los
    dispositivos disponibles y su capacidad para mantener un funcionamiento adecuado ante diferentes condiciones
    de conectividad y demanda de usuarios.
  estado: aprobado
- id: C08
  dimension: Contraste de resultados y validación del aprendizaje mediante la simulación.
  criterio_corto: Verificación y contraste de resultados mediante representaciones experimentales.
  enunciado: El laboratorio virtual debe permitir contrastar los resultados obtenidos por los estudiantes
    con representaciones, respuestas y soluciones de referencia, facilitando la verificación de procedimientos,
    la identificación de errores conceptuales y la autorregulación del aprendizaje mediante la interpretación
    de resultados y el diálogo pedagógico.
  estado: aprobado
  ejemplos:
    0: 'Ejemplo: «Los estudiantes observaban que la energía mecánica se conservaba.»'
    1: 'Ejemplo: «Los estudiantes calculaban el alcance a mano y lo comparaban con el que mostraba la
      simulación.»'
  cuenta:
  - Predice y luego compara con lo observado (predecir-observar-explicar).
  - Compara su resultado con un valor de referencia o con la teoría.
  - Compara su cálculo a mano con el simulador.
  - Verifica una ley o un resultado conocido.
  - Contrasta lo esperado con lo obtenido.
  - Recrea el montaje real para contrastarlo con la simulación.
  no_cuenta:
  - Observar un principio (p. ej., la conservación) sin compararlo con nada.
  - 'Comparar grupos o condiciones del estudio: es diseño del estudio, no actividad del estudiante.'
  - Que el docente corrija las respuestas (va a C04).
  - La clave de un cuestionario, salvo que la ficha diga que el estudiante contrasta su respuesta con
    ella.
- id: C09
  dimension: Accesibilidad y viabilidad tecnológica del laboratorio virtual
  criterio_corto: Acceso en contextos de baja conectividad y recursos limitados
  enunciado: El laboratorio virtual debe poder usarse con los dispositivos, la conectividad, el idioma
    y los recursos económicos disponibles en las instituciones, sin depender de equipos costosos, licencias
    pagas ni conexión permanente.
  estado: 'borrador: revisar Luis Fer'
  ejemplos:
    0: 'Ejemplo: «Idioma, costo y conectividad: no reporta.»'
    1: 'Ejemplo: «La simulación se descargó para usarla sin conexión en el aula; no se informa si cambió
      la participación.»'
