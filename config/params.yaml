# La raíz del Drive NO va aquí: se lee de la variable de entorno indicada abajo,
# para que la ruta (con el correo institucional) no quede en el repositorio.
drive_root_env: RS_DRIVE_ROOT

# Rutas relativas a la raíz del Drive (Cribado_Bibliografia_PRISMA/)
archivos:
  cribado: 02_cribado/Cribado_titulo_resumen_2026-10-06.csv
  recuperacion: 03_recuperacion/Recuperacion_textos_completos_2026-10-10.csv
  elegibilidad: 04_elegibilidad/Elegibilidad_texto_completo_v3_2026-10-26.csv
  dudosos: 04_elegibilidad/Casos_dudosos_elegibilidad_v4_decididos_2026-10-26.csv
  extraccion: 05_extraccion/Extraccion_datos_v2_2026-10-18.csv
  prisma_counts: 06_prisma/prisma_counts_2026-10-26.json   # versión base (Drive, solo lectura)
  registro_busquedas: 01_busquedas/Registro_busquedas_PRISMA_v3.md

# Exclusiones de elegibilidad por nivel (D33) y la versión vigente de prisma_counts,
# que se escribe en el repo con `prisma_02 --derivar-counts` (el Drive no se toca).
exclusiones_nivel: config/exclusiones_nivel.yaml
prisma_counts_vigente: config/prisma_counts_2026-10-29.json

# PDF de otro documento ya separados por Luis Fer (el ID es el prefijo del nombre)
carpeta_no_corresponde: 03_recuperacion/artículos_pdf/_no_corresponde

# Ventana de búsqueda (años de la base de datos, D24)
ventana_busqueda: [2021, 2026]

# Regla 3 de elegibilidad, confirmada por Luis Fer el 29 oct 2026 (D31). Reemplaza las redacciones anteriores.
regla_3_elegibilidad:
  texto: "Se incluyen los estudios con estudiantes de 2.º año universitario cuando el curso es todavía de ciencia básica o introductoria (p. ej., química general II, física para ciencias de la salud). Se excluyen los cursos avanzados o profesionalizantes (E1, población)."
  confirmada_por: "Luis Fer, 29 oct 2026"
  reglas_aprobadas_11_oct: "1. Cursos de ciencias en programas de formación docente: incluir. 2. Universitarios de 1.er año voluntarios: incluir. 3. [reemplazada por la regla 3 de arriba, D31] 4. Semestre no reportado con contenido introductorio: incluir."

# Mapeo de normalización de la matriz de extracción
categorias: config/categorias.yaml

# Reclasificaciones aplicadas sobre el CSV de cribado (el Drive no se toca)
reclasificaciones: config/reclasificaciones.yaml

salidas:
  figuras: outputs/figuras
  procesados: data/processed
  tablas: outputs/tablas
  nombre_base_diagrama: Diagrama_PRISMA_2020_Eje3

# Grupos de fuentes del Registro de búsquedas (los nombres deben existir en el Registro)
fuentes_identificacion:
  bases_de_datos: [ERIC, SciELO, Scopus]
  repositorios_de_tesis: [La Referencia, BDTD]

# Textos de las cajas del diagrama (decididos por Luis Fer, 28 oct 2026)
etiquetas_exclusion:
  E1: Población
  E2: Intervención
  E3: Disciplina
  E4: Tipo de estudio (sin datos empíricos de resultados)
  E5: Tipo de publicación
etiquetas_no_recuperados:
  sin_acceso: Sin acceso
  duplicado: Duplicado detectado en la recuperación
  pdf_otro_documento: PDF de otro documento
  incompletos_ilegibles: Incompletos o ilegibles

# Mini-sprint semántico (BERTopic). Venv aparte; todo local, sin llamadas a la API.
# Las salidas con fragmentos o palabras de los artículos van a una carpeta ignorada por git.
semantico:
  venv: .venv-semantico
  requirements: requirements-semantico.txt
  salidas: outputs/semantico
  # Revisión (commit) fijada de cada modelo de Hugging Face; la caché queda fuera del repo.
  # No usar modelos más grandes (e5-large o similares): el límite es la RAM (8 GB).
  modelos:
    principal:
      id: intfloat/multilingual-e5-base
      revision: d128750597153bb5987e10b1c3493a34e5a4502a
      prefijo: "passage: "
      palabras_por_trozo: 150
    control:
      id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      prefijo: ""
      palabras_por_trozo: 90
  stopwords: config/stopwords_semantico.yaml   # unión es/en/pt; incluye estudiante/estudio/resultados
  semillas: [1, 2, 3, 4, 5]                    # semillas de UMAP (HDBSCAN es determinista)
  semilla_azar: 2026                           # línea base de coherencia: asignaciones barajadas
  semilla_codigos: 2026                        # códigos de la hoja de calificación a ciegas
  umap: {n_neighbors: 15, n_components: 5, min_dist: 0.0, metric: cosine}
  min_topic_size: 10
  palabras_clave: 10
  # Prueba 1 (mecánica): trozos del texto completo de 10 informes, aprobados el 29 oct 2026
  prueba1:
    informes: [R0998, R0045, R0578, R0527, R1085, R0755, R0711, R0730, R0713, R0922]
    ruta_textos: _trabajo/ext/txt                # en el Drive, solo lectura
    minimo_ultimo_trozo: 0.4                     # el último trozo corto se une al anterior
    maximo_oracion_veces_trozo: 3                # una "oración" más larga no es prosa: se descarta
    proporcion_alfabetica_minima: 0.6            # trozos con muchas cifras (tablas) se descartan
    minimo_pct_idioma: 10                        # un tema "mezcla idiomas" si 2+ idiomas pasan de este %
    umbral_dominancia: 0.7                       # tema "de un documento": >70 % de sus trozos de un informe
  # Prueba 2 (principal): fichas de los 196 informes (sin los excluido_nivel)
  prueba2:
    minimo_palabras: 5                           # fichas más cortas ("no reporta") se descartan
    separador_criterios: " || "                  # oe2_criterios_candidatos: un criterio por unidad
    umbral_dominancia: 0.7
    campos:
      oe1: [oe1_hallazgo]
      oe2: [oe2_herramienta, oe2_andamiaje, oe2_retroalimentacion, oe2_interactividad,
            oe2_dispositivo, oe2_conectividad, oe2_idioma_accesibilidad, oe2_costo_licencia,
            oe2_usabilidad_calidad, oe2_criterios_candidatos]
      oe4: [oe4_momento, oe4_secuencia, oe4_organizacion, oe4_rol_docente, oe4_steam,
            oe4_barreras, oe4_comunidades_aprendizaje]
    # oe2_tipo_herramienta no entra: son 3 etiquetas repetidas (ya normalizadas) y formarían temas triviales
    campos_excluidos: [oe2_tipo_herramienta]
  # Umbrales "sigue / no sigue" aprobados el 29 oct 2026
  umbrales:
    tiempo_embeddings_s: 300          # los 10 informes, por modelo, en MPS
    ari_semillas_sigue: 0.6
    ari_semillas_no_sigue: 0.4
    outliers_sigue_pct: 40
    outliers_no_sigue_pct: 60
    mezcla_idiomas_sigue_pct: 50      # solo Prueba 1
    temas_de_un_documento_no_util_pct: 50   # solo Prueba 1
    interpretables_sigue_pct: 60      # lo califica Luis Fer en la hoja a ciegas
    interpretables_no_sigue_pct: 40
    minimo_temas_interpretables: 3
  hoja_ciega:
    fragmentos: 3
    palabras_por_fragmento: 60
    max_temas_por_corrida: null       # null = todos los temas de la corrida elegida
  salidas_metricas: outputs/semantico_metricas   # solo números: va a git

